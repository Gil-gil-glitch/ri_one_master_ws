# ============================================================
# nav2_params.yaml
# 壁衝突防止に特化したNav2パラメータ設定
# 使い方:
#   ros2 launch nav2_bringup navigation_launch.py \
#     map:=$HOME/maps/my_map.yaml \
#     params_file:=$HOME/maps/nav2_params.yaml
# ============================================================

amcl:
  ros__parameters:
    # ── パーティクル数（多いほど自己位置推定が安定、重くなる） ──
    min_particles: 500
    max_particles: 3000
    # レーザースキャンの最大距離
    laser_max_range: 8.0
    laser_min_range: 0.15
    # 使用するビーム数（多いほど精度UP、重くなる）
    max_beams: 60
    # ロボットが動いていないときにパーティクルを更新しない
    update_min_d: 0.05       # 20cmから5cmに短縮。より頻繁に自己位置を更新する
    update_min_a: 0.05       # 0.3(約17度)から0.05(約2.8度)に短縮。回転時も精度を保つ
    # パーティクルフィルタの係数（デフォルトのまま推奨）
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # グローバル座標系
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint  # ロボットに合わせて変更

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10    # 精度のために0.25から0.10[m]に短縮
      yaw_goal_tolerance: 0.10    # 精度のために0.4から0.10[rad] (約5.7度)に短縮
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ── 速度制限（遅くすることで衝突リスクを大幅に低減） ──
      desired_linear_vel: 0.25      # 通常走行速度 [m/s]（デフォルト0.5から半減）
      max_linear_accel: 2.5
      max_linear_decel: 2.5
      max_angular_accel: 3.2

      # ── 先読み距離（短くすると曲がり角での精度UP） ──
      lookahead_dist: 0.4           # デフォルト0.6から短縮
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      lookahead_time: 1.5

      # ── 障害物接近時の速度調整（重要） ──
      use_regulated_linear_velocity_scaling: true   # 障害物に近いほど減速
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.08      # 最低速度（止まらない程度）

      # ── 衝突検出の先読み（これが壁衝突防止の核心） ──
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0  # 2秒先まで衝突チェック

      # 回転のみゴール補正
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.785   # 45度以上ずれていたら回転優先

      # ── パス逸脱時の再プラン ──
      transform_tolerance: 0.1   # 0.2から0.1に短縮して応答性を向上

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4        # ローカルコストマップのサイズ[m]
      height: 4
      resolution: 0.05

      # ── ロボットの形状（重要: 実機に合わせて変更） ──
      robot_radius: 0.25    # ★ ロボットの半径[m]に変更してください

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan       # ★ LiDARのトピック名に合わせて変更
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0    # 3.0から5.0に拡大。遠くの「ゴースト」をより確実に消去する
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2    # 自分の機体に当たる反射ノイズを除去する

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ── インフレーション（壁の周囲にコストをつける）──
        # ここが壁衝突防止で最も重要なパラメータ
        cost_scaling_factor: 15.0  # 8.0から15.0に拡大。壁際以外はすぐに「安全」と判定するようにする
        inflation_radius: 0.4      # ★ 壁からの膨張距離（不要に大きいと道が塞がれるため縮小）

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05

      robot_radius: 0.25    # ローカルと同じ値に揃える (0.3 -> 0.25)

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan       # ★ LiDARのトピック名に合わせて変更
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2    # 自分の機体反射を除外

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.4      # ★ ローカルと同じ値に揃える

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1    # 0.5から0.1に短縮。ゴールの近くまで確実にパスを引くようにする
      use_astar: true        # A*を使う（Dijkstraより壁を避けやすい）
      allow_unknown: true

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    # スタック時のリカバリ動作
    spin_dist: 1.57           # 90度回転して脱出
    backup_dist: 0.3          # 30cm後退して脱出
    backup_speed: 0.05
    simulate_ahead_time: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
